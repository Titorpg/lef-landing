<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEF · Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F0F0F;          /* negro LEF */
  --bg:#F7F6F3;           /* gris claro de la plataforma */
  --card:#FFFFFF;
  --line:#E3E1DC;         /* gris bordes */
  --muted:#6B6B6B;        /* gris texto secundario */
  --blue:#2C4A9A;         /* azul LEF (enlaces plataforma) */
  --sky:#7FA7D8;          /* celeste portada */
  --sky-soft:#EAF1FA;
  --wrong:#3A3A3A;
  --wrong-soft:#EFEEEB;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Jost",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
header.top img{height:38px;width:auto;display:block}
header.top .mod{font-size:14px;color:var(--muted);text-align:right;line-height:1.3}
header.top .mod b{display:block;color:var(--blue);font-weight:600;font-size:15px}
.hero{padding:28px 0 8px}
.hero h1{font-family:"Archivo Black","Arial Black",Impact,sans-serif;font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0 0 10px;text-transform:uppercase;letter-spacing:.01em}
.hero .topic{font-size:19px;margin:0 0 6px}
.hero .how{color:var(--muted);margin:0;font-size:15px}
.progress{display:flex;gap:6px;margin:20px 0 6px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.progress span.done{background:var(--sky)}
.progress-label{font-size:13px;color:var(--muted)}
section.part{margin-top:34px}
.part-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.part-head .n{white-space:nowrap;font-family:"Archivo Black","Arial Black",sans-serif;font-size:15px;background:var(--ink);color:#fff;border-radius:8px;padding:3px 10px}
.part-head h2{margin:0;font-size:21px;font-weight:600}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:14px}
.ex .ins{font-weight:600;margin:0}
.ex .help{color:var(--muted);font-size:15px;margin:2px 0 14px}
.reading{background:var(--sky-soft);border-left:4px solid var(--sky);padding:16px 18px;margin:0 0 18px;font-size:16.5px}
.reading p{margin:0 0 8px}.reading p:last-child{margin:0}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.q{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.q .num{color:var(--muted);font-size:14px;min-width:20px;padding-top:2px}
.q .txt{flex:1}
.mark{font-weight:600;min-width:20px;text-align:center}
.item.ok .mark{color:var(--blue)}
.item.bad .mark{color:var(--wrong)}
.opts{display:flex;flex-wrap:wrap;gap:8px;padding-left:30px}
.opt{font:inherit;font-size:15px;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt:focus-visible,.write:focus-visible,.btn:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.opt.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.item.ok .opt.sel{background:var(--blue);border-color:var(--blue)}
.item.bad .opt.sel{background:var(--wrong-soft);color:var(--wrong);border-color:var(--wrong);text-decoration:line-through}
.opt:disabled{cursor:default}
.write{font:inherit;font-size:16px;width:calc(100% - 30px);margin-left:30px;max-width:320px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.item.ok .write{border-color:var(--blue);color:var(--blue)}
.item.bad .write{border-color:var(--wrong);background:var(--wrong-soft)}
.why{display:none;margin:10px 0 0 30px;font-size:15px;color:var(--wrong);background:var(--wrong-soft);border-radius:10px;padding:8px 12px}
.why b{color:var(--ink)}
.item.bad .why{display:block}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;margin-top:6px}
.btn{font:inherit;font-weight:600;font-size:16px;border-radius:12px;padding:12px 22px;cursor:pointer;border:2px solid var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink)}
.score{font-weight:600;color:var(--blue)}
.err{color:var(--wrong);font-size:14px;width:100%}
.final{display:none;margin-top:36px;background:var(--ink);color:#fff;border-radius:16px;padding:26px 22px}
.final.show{display:block}
.final .big{font-family:"Archivo Black","Arial Black",sans-serif;font-size:44px;line-height:1;margin:0 0 8px;color:#fff}
.final .big small{font-size:18px;color:var(--sky)}
.final p{margin:0;color:#DADADA}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media (max-width:480px){.opts,.why{padding-left:0;margin-left:0}.write{margin-left:0;width:100%}.q .num{min-width:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

   - mensajes: lo que ve el estudiante al terminar, según su puntaje
               (alto = 90 % o más, medio = 70 % a 89 %, bajo = menos de 70 %)
   - parts:    las partes del taller (se recomiendan 2 a 4). Cada parte tiene
               un título y uno o más ejercicios.

   Cada ejercicio:
   - type:    "choice" (el estudiante elige un botón) o "write" (escribe)
   - ins:     instrucción en inglés
   - help:    ayuda en español
   - reading: (opcional) texto para leer, una lista de párrafos
   - options: solo en "choice": los botones que puede elegir
   - items:   las preguntas. Cada una con:
       q:   la pregunta
       a:   en "choice", la respuesta correcta (escrita IGUAL que en options);
            en "write", una lista con las respuestas aceptadas, en minúscula
            (ej. ["you're"]; se ignoran mayúsculas y el punto final)
       why: explicación en español que ve si se equivoca (puede usar <b>negrita</b>)
   ========================================================= */
const TALLER = {
  modulo: "A1.1 Hello, World",
  title: "Taller semana 1",
  topic: "Greetings and verb to be",
  tiempo: "15 a 20 minutos",
  mensajes: {
    alto: "¡Excelente trabajo! Dominas los temas de la semana 1.",
    medio: "¡Muy bien! Revisa los ítems marcados con ✗ e inténtalo otra vez.",
    bajo: "Repasa las páginas 2, 3 y 4 del libro y vuelve a hacer el taller."
  },
  parts: [
    {
      title: "Vocabulary: greetings",
      exercises: [{
        type: "choice",
        ins: "What is each expression for? Choose the correct group.",
        help: "¿Para qué sirve cada expresión? Elige el grupo correcto.",
        options: ["Greeting","Farewell"],
        items: [
          {q:"Good morning!", a:"Greeting", why:"Es un saludo que usamos en la mañana."},
          {q:"See you tomorrow!", a:"Farewell", why:"Es una despedida: nos vemos mañana."}
        ]
      }]
    },
    {
      title: "Grammar: verb to be",
      exercises: [
        {
          type: "choice",
          ins: "Complete with am, is or are.",
          help: "Completa con la forma correcta del verbo to be.",
          options: ["am","is","are"],
          items: [
            {q:"I ___ a student.", a:"am", why:"Con <b>I</b> siempre va <b>am</b>."},
            {q:"They ___ my friends.", a:"are", why:"Con <b>they</b> va <b>are</b>."}
          ]
        },
        {
          type: "write",
          ins: "Write the contraction.",
          help: "Escribe la forma corta. Ejemplo: I am = I'm",
          items: [
            {q:"You are", a:["you're"], why:"You are = <b>You're</b>"},
            {q:"She is", a:["she's"], why:"She is = <b>She's</b>"}
          ]
        }
      ]
    },
    {
      title: "Reading: my first day",
      exercises: [{
        type: "choice",
        reading: [
          "Hi! My name is Valentina. I am from Barranquilla and I am 19 years old.",
          "Today is my first day in the English class at LEF."
        ],
        ins: "Read the text. Are the sentences true or false?",
        help: "Lee con atención y responde.",
        options: ["True","False"],
        items: [
          {q:"Valentina is from Barranquilla.", a:"True", why:"El texto dice: <b>I am from Barranquilla</b>."},
          {q:"Valentina is 25 years old.", a:"False", why:"Valentina tiene <b>19</b> años."}
        ]
      }]
    }
  ]
};

/* =========================================================
   LÓGICA (no es necesario modificar)
   ========================================================= */
const norm = s => s.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?]+$/,"").replace(/\s+/g," ").trim();
const state = TALLER.parts.map(p => ({checked:false, correct:0, total:p.exercises.reduce((n,e)=>n+e.items.length,0)}));

document.getElementById("title").textContent = TALLER.title;
document.getElementById("topic").textContent = TALLER.topic;
document.getElementById("modName").textContent = TALLER.modulo;
document.getElementById("tiempo").textContent = TALLER.tiempo;
document.getElementById("footMod").textContent = TALLER.modulo;
document.title = "LEF · " + TALLER.title + " · " + TALLER.modulo;
const prog = document.getElementById("progress");
TALLER.parts.forEach(()=>prog.appendChild(document.createElement("span")));

const app = document.getElementById("app");
TALLER.parts.forEach((part, pi) => {
  const sec = document.createElement("section");
  sec.className = "part";
  sec.innerHTML = `<div class="part-head"><span class="n">Parte ${pi+1}</span><h2>${part.title}</h2></div>`;
  part.exercises.forEach((ex, ei) => {
    const box = document.createElement("div");
    box.className = "ex";
    let html = "";
    if (ex.reading) html += `<div class="reading">${ex.reading.map(p=>`<p>${p}</p>`).join("")}</div>`;
    html += `<p class="ins">${ex.ins}</p><p class="help">${ex.help}</p>`;
    ex.items.forEach((it, ii) => {
      const id = `p${pi}e${ei}i${ii}`;
      html += `<div class="item" id="${id}" data-p="${pi}" data-e="${ei}" data-i="${ii}">
        <div class="q"><span class="num">${ii+1}.</span><span class="txt">${it.q}</span><span class="mark" aria-hidden="true"></span></div>`;
      if (ex.type === "choice") {
        html += `<div class="opts" role="group" aria-label="Opciones para la pregunta ${ii+1}">` +
          ex.options.map(o=>`<button type="button" class="opt" data-v="${o}">${o}</button>`).join("") + `</div>`;
      } else {
        html += `<input class="write" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Respuesta ${ii+1}" placeholder="Escribe aquí">`;
      }
      html += `<div class="why"></div></div>`;
    });
    box.innerHTML = html;
    sec.appendChild(box);
  });
  const act = document.createElement("div");
  act.className = "actions";
  act.innerHTML = `<button type="button" class="btn primary" data-act="check">Revisar respuestas</button><span class="score" aria-live="polite"></span><span class="err" aria-live="polite"></span>`;
  sec.appendChild(act);
  app.appendChild(sec);

  sec.addEventListener("click", e => {
    const opt = e.target.closest(".opt");
    if (opt && !state[pi].checked) {
      opt.parentElement.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
      opt.classList.add("sel");
      act.querySelector(".err").textContent = "";
      return;
    }
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    btn.dataset.act === "check" ? checkPart(pi, sec, act) : resetPart(pi, sec, act);
  });
  sec.addEventListener("input", () => { act.querySelector(".err").textContent = ""; });
});

function answerOf(el, ex){
  if (ex.type === "choice") { const s = el.querySelector(".opt.sel"); return s ? s.dataset.v : ""; }
  return el.querySelector(".write").value;
}

function checkPart(pi, sec, act){
  const part = TALLER.parts[pi];
  const items = [...sec.querySelectorAll(".item")];
  const missing = items.filter(el => !answerOf(el, part.exercises[el.dataset.e]).trim()).length;
  if (missing) {
    act.querySelector(".err").textContent = missing === 1 ? "Te falta 1 respuesta. Complétala antes de revisar." : `Te faltan ${missing} respuestas. Complétalas antes de revisar.`;
    return;
  }
  let ok = 0;
  items.forEach(el => {
    const ex = part.exercises[el.dataset.e], it = ex.items[el.dataset.i];
    const val = answerOf(el, ex);
    const good = ex.type === "choice" ? val === it.a : it.a.map(norm).includes(norm(val));
    el.classList.add(good ? "ok" : "bad");
    el.querySelector(".mark").textContent = good ? "✓" : "✗";
    if (!good) el.querySelector(".why").innerHTML = (ex.type==="choice" ? `Respuesta correcta: <b>${it.a}</b>. ` : "Respuesta correcta: ") + it.why;
    el.querySelectorAll(".opt,.write").forEach(c => c.disabled = true);
    if (good) ok++;
  });
  state[pi].checked = true; state[pi].correct = ok;
  act.querySelector(".score").textContent = `${ok} de ${items.length} correctas`;
  const b = act.querySelector("[data-act]");
  b.dataset.act = "reset"; b.textContent = "Intentar de nuevo"; b.className = "btn ghost";
  updateProgress();
}

function resetPart(pi, sec, act){
  sec.querySelectorAll(".item").forEach(el => {
    el.classList.remove("ok","bad");
    el.querySelector(".mark").textContent = "";
    el.querySelector(".why").innerHTML = "";
    el.querySelectorAll(".opt").forEach(o => { o.classList.remove("sel"); o.disabled = false; });
    const w = el.querySelector(".write"); if (w) { w.value = ""; w.disabled = false; }
  });
  state[pi].checked = false; state[pi].correct = 0;
  act.querySelector(".score").textContent = "";
  const b = act.querySelector("[data-act]");
  b.dataset.act = "check"; b.textContent = "Revisar respuestas"; b.className = "btn primary";
  updateProgress();
}

function updateProgress(){
  const done = state.filter(s=>s.checked).length;
  [...prog.children].forEach((s,i)=>s.classList.toggle("done", state[i].checked));
  document.getElementById("progressLabel").textContent = `${done} de ${state.length} partes revisadas`;
  const fin = document.getElementById("final");
  if (done === state.length) {
    const c = state.reduce((n,s)=>n+s.correct,0), t = state.reduce((n,s)=>n+s.total,0);
    const pct = Math.round(c/t*100);
    document.getElementById("finalScore").innerHTML = `${c}/${t} <small>${pct}%</small>`;
    document.getElementById("finalMsg").textContent =
      pct >= 90 ? TALLER.mensajes.alto :
      pct >= 70 ? TALLER.mensajes.medio :
      TALLER.mensajes.bajo;
    fin.classList.add("show");
  } else fin.classList.remove("show");
}
updateProgress();
</script>
</body>
</html>
